<!-- templates/overview/overview.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}面试排队总览 - 面试系统{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/core.css' %}">
<link rel="stylesheet" href="{% static 'css/overview.css' %}">
{% endblock %}

{% block content %}
<div class="overview-container">
    <!-- 页面头部 -->
    <header class="overview-header">
        <div class="header-left">
            <span class="overview-kicker">实时面试调度</span>
            <h1>面试排队总览</h1>
            <p>按部门查看待开始、进行中和暂停中的场次</p>
        </div>
        <div class="header-right">
            <div class="polling-status">
                <span class="status-dot active"></span>
                <span class="status-text">自动刷新</span>
                <span class="status-countdown" id="countdownTimer">180s</span>
            </div>
            <span class="last-updated" id="lastUpdated">--</span>
            <button class="btn btn-secondary" id="autoGroupBtn">
                <span class="button-spinner" aria-hidden="true"></span>
                <span class="button-label">自动分组</span>
            </button>
            <button class="btn btn-primary" id="refreshBtn" title="刷新数据，并按现有规则执行自动分组">
                <span class="button-spinner" aria-hidden="true"></span>
                <span class="button-label">刷新并分组</span>
            </button>
        </div>
    </header>

    <!-- 卡片网格 2行3列 -->
    <div class="cards-grid" id="cardsContainer">
        <!-- 由 JavaScript 动态渲染 -->
        <div class="loading-placeholder">
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
        </div>
    </div>
</div>

<!-- Toast 通知 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/overview.js' %}"></script>
{% endblock %}
